GATE: "BATCH_1 run at screen: 30s hold still at center -> one source dominates > 2x others -> fix target unambiguous. USER: run --diag-jitter, capture 30s, share summary."
      DONE_NOTE: "2026-09-16 code+QA+security PASS (exit 0; bridge 27 tests incl new BATCH_1x/y/z/w, driver 23/23; ReleaseSafe compiles). Implemented: VarWindow (100-frame O(1) variance) in tobii_filter.zig; diag_jitter/diag_corners struct fields (placed BEFORE consts block per Zig 'no declarations between container fields'); diag feed inside trace gate: raw=(g_corr[0]-0.5)*gaze_scale (pre-EWMA device), oe=fy_head-head_yaw (One-Euro residual), tug=tug_out; DIAG_JITTER_SUMMARY once at 30s (sqrt of mean-square per source, frames=2700 @90Hz). Second trace line (vl/vr/pl/pr/ne/jd/nd/nt/pr/rv/ov/tv) split from main line — Zig fmt 32-arg cap; legacy trace line byte-identical. pitch_rate = one-pole |Δfp_head|/dt. --diag-jitter/--diag-corners flags in main.zig parseArgs + usage. calibration.zig: jaw_diff_sum/cnt accumulators + 'cal quality valid=/eye_loss_rate=/avg_jaw_diff=' log at finalizePoint. PLAN_DEVIATION: 'tug_vs_raw_deg' measured as tug_out (clamped tug contribution) not tug_yaw-raw (H3 metric equivalent); window variance fields rv/ov/tv = VarWindow.variance() population. USER GATE DONE 2026-09-19 (real rig, 30s hold still at screen center, frames=976): DIAG_JITTER_SUMMARY raw_noise_rms=8.9408 oe_residual_rms=12.7842 tug_deviation_rms=2.7944. ATTRIBUTION (BATCH_1 GATE RESULT): dominant source = ROTATION-PATH (oe/One-Euro residual path) — trace shows corner_hold ENGAGED (ch=1) while head_yaw stays ±0.5° (hp≈0) and gaze pinned gy≈-11.8° at CENTER stare (cal bias; loaded cal fit x=(0.104/1.143) does not zero center), radial>12° corner_pin_deg gate crossed -> v4.6 n=2 corner REACH glides fy_head -0.22→-20.97°→-0.23 (~21° swim, 16°/s) on a STILL head. VERDICT: H4 calibration center-error triggers H2 corner machinery = the visible 'jitter at a spot'. Window-variance stats over diag window (975 frames): raw_jitter_std=2.5772 (var mean 6.64), oe_jitter_std=5.2423 (var mean 27.48), tug_jitter_std=1.0770 (var mean 1.16) — oe >2x raw >5x tug: fix target unambiguous = corner-h...
  - [x] BATCH_2: "JITTER_FIX — data-derived corner-gate head-turn witness (per BATCH_1 attribution: cal center-bias trips corner_pin_deg=12 radial gate on still head → n=2 corner REACH glides fy_head 21° mid-hold)"
      FILES: ["applications/tobiifree-opentrack/src/tobii_filter.zig (gaze_pinned ~:1801, corner_hold engage ~:1832, n=2 reach ~:1854)", "applications/tobiifree-opentrack/src/bridge_tests.zig"]
