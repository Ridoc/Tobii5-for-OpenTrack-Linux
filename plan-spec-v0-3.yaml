        - "DIAG_JITTER mode (--diag-jitter): 100-frame sliding window variance fields raw_yaw_var_100w, oe_residual_deg (smoothed-raw), tug_vs_raw_deg; 30s at rest -> summary raw_noise_rms / oe_residual_rms / tug_deviation_rms"
        - "--diag-corners flag (headless-capable) for corner trace (from tech-debt batch3)"
        - "per-point cal quality log (calibration.zig finalizePoint ~:147-171: valid_count/total, eye_loss_rate, avg_jaw_diff)"
