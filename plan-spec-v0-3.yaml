# plan-spec-v0-3.yaml — v0.3: Jitter-First + Corner Gate + Cal Quality
PLAN_NAME: "v0-3"
TITLE: "v0.3 Jitter-First: kill at-rest jitter (P0), re-gate corners, cal accuracy diagnostic + UX"
VERSION: "0.1"
DATE: "2026-09-16"
BASE_COMMIT: "e3da30f (v0.2.7 release)"
STATUS: "AWAITING_APPROVAL"

USER_DIRECTIVE (verbatim intent):
  - "jitter in center space must be fixed first of all!! calibration or smoothing issue. i can look at a spot and still there is jitter"
  - "corners can be fixed after; calibration and UX and all other after that"
  - "jitter needs to be gone with highest prio, even before corner fix"
PRIORITY: "JITTER > CORNER_GATE > CAL_ACCURACY > UX_VIZ"

RESEARCH (external assessment 2026-09-16):
  Tropaion/Tobii_Linux: "Rust clean-room ET5 driver; --accuracy 39-target sweep (13x3) per-target/per-eye/angle-band error + diagnosis; follow-the-dot cal re-applied on EVERY connect; tolerance-region trackbox viz; guided EDID display setup. LEARNING: accuracy diag + cal re-apply + tolerance viz -> adopted."
  njmill/tobii-linux: "ET5 native TTP reader + MediaPipe headpose + Wine stock-DLL bridge (Star Citizen). LEARNING: ML pitch model exists (non-commercial weights) -> OUT_OF_SCOPE v0.3."
  TalonCommunity/Wiki: "screen-too-big-for-tracker -> corner dots unreachable (MIRRORS our UL-reach gap); control-mouse = look + head-lock region. LEARNING: keep cal stimulus within usable range -> reinforces corner gate checklist."
  ADOPTED: ["accuracy-diagnostic", "cal-reapply-on-connect", "tolerance-region-viz"]
  OUT_OF_SCOPE: ["packaging/udev", "ML-pitch-model", "gaze-mouse", "virtual-joystick", "EDID-setup-change", "native-X4-plugin"]

PRODUCT_SPEC (product-owner):
  VISION: "v0.3 kills at-rest jitter via DATA-DERIVED fix (no guesswork), re-gates corners, adds Tropaion-style accuracy diagnostic + cal re-apply on connect, polishes UX. Every fix has a measurement gate."
  STORIES:
    - "P0 x4-player: looking STRAIGHT at a static panel -> zero visible jitter (crosshair/view steady)"
    - "P0 tester: --diag-jitter 30s at rest -> machine-parseable trace identifying dominant source (raw device noise | One-Euro residual | tug-path | calibration fit)"
    - "P1 x4-player: HOLDING L/R corners stays ~95 deg, no 90-deg creep, upper corners reach edge, no pops"
    - "P2 x4-player: --accuracy sweep -> per-target/per-eye error mm + mean/stdev -> tells if cal is good"
    - "P2 daemon: calibration auto-re-applied on every ET5 connect (USB replug/hibernate)"
    - "P3 x4-player: dimmed extended-track-area rect + 'uncalibrated — run wizard' badge"
  METRICS:
    north_star: "at-rest gaze RMS jitter < 0.15 deg output (p95)"
    kpis: {raw_device_noise_rms: "baseline (hardware, accept)", oe_residual_rms: "< 0.10 deg", tug_deviation_rms: "< 0.20 deg", corner_reach_pct: ">= 90% each side", cal_mean_error_mm: "< 30 mm (800x330 screen)", cal_auto_reapply: "100% of reconnects"}
  JITTER_FRAMING (data-first rule: NO alpha/gate change until BATCH_1 identifies dominant source):
    H1_device_raw_noise: "measure raw variance pre-filter; raw_rms > 0.03 deg -> device dominant"
    H2_pipeline_smoothing: "oe_residual = smoothed-raw; > 2x raw_noise_rms -> One-Euro/EWMA too weak"
    H3_gui_viz_tug_path: "tug_deviation = tug_output - raw_gaze; > 3x raw_noise_rms -> drawViz smoothing separate"
    H4_calibration_fit: "center-point error from --accuracy > 15 mm -> calibration contributor (resolves via BATCH_4)"

DESIGN_SPEC (ux-designer):
  jitter_fix_ux: "eye dots + head dot sub-0.5px idle; per-eye low-pass alpha 0.3 + tug-path EWMA; trail dots tight cluster < 3px; --debug-viz flag shows 'S:0.88 T:0.30' 11px dim text; wizard dot jitter-free during .showing_point"
  cal_quality: "post-wizard prompt 'Accuracy check? [Yes] [Skip]'; 39-target sweep (13x3, 10% margin), 1s hold/target (~60 frames), auto-advance; per-target radial error color: green<20px yellow 20-50 orange 50-100 red>100px + radius r=6+error/20 cap 24; per-eye toggle L/R; angle bands center(3x3)/mid(ring2)/edge(outer) error_p95; CTA 'Accuracy OK — done' | 'Improve my calibration — Retry'; new CalState .accuracy_check + .show_accuracy_results; reuse g_cal_window + calDrawFunc + progress-ring style"
  hub_readout: "OPTIONAL (BATCH_5): 6 labels top-left of drawViz (Yaw/Pitch/Roll/X/Y/Z 12px white), 1Hz, collapse < 400px, a11y AA"
  a11y: "WCAG AA contrast; error dots color+radius paired (colorblind); ESC skip, L/R toggle, SPACE start; prefers-reduced-motion skips trails"

ACCEPTANCE_CRITERIA (ux-reviewer):
  JITTER_FIX:
    - "GUI eye-dot displacement at rest <= 3px p95 @ typical distance; no tremor at 30Hz"
    - "in-game yaw var <= 0.3 deg p95 / pitch <= 0.5 deg p95 over 5s hold (UDP 4242)"
    - "fast 220deg/s reversal: lag <= 7 deg (v4.7 exp hit 6.3; v4.6 baseline 11.2); NO overshoot past ring edge"
    - "release-ease step <= 6.0 deg (v4.7 BROKE BATCH_2i bound — regression guard)"
    - "no deadband feel: 5-15 deg small movements respond immediately"
    - "thresholds DATA-DERIVED from BATCH_1 baseline, NOT hardcoded (no magic 0.12)"
    - "smoothing change visible within <= 1 frame; no re-acquisition lag after blink"
  CORNER_GATE (v4.6 re-test, X4 running, user at screen):
    - "(a) HOLD L/R corners ~95 deg, NO creep > 100 over 10s, no drift-to-center"
    - "(b) UL/UR corners reach >= 88 deg yaw without exaggerated chin lift"
    - "(c) hold->release no single-frame pop > 6 deg (covers @449); release->re-hold no pop"
    - "(d) lower-corner hold > 5s: pitch no dive to 90; pitch var <= 2 deg p95"
  CAL_ACCURACY_DIAGNOSTIC:
    - "39-target sweep completes w/o crash; ESC exits cleanly (no zombie); eye-loss mid-sweep target marked 'eye_lost' visible gap, NOT silent omit"
    - "per-target error_deg, per-eye L/R, per-angle-band (0-30/30-60/60-90)"
    - "actionable guidance emitted ('corner accuracy poor — re-run wizard' | 'asymmetry detected')"
    - "diagnostic does NOT write/overwrite calibration.json; separate opt-in mode, wizard untouched"
    - "cal gates: eye_loss_rate > 30% corner pts -> RETRY + visible WARN; MIN_VALID_PER_POINT 30 (was 15); MAX_POINT_RETRIES 4 (was 3)"
    - "visible exit + progress (reuse wizard progress-ring); 'Eye lost — waiting...' indicator"
  UX_VIZ:
    - "dimmed extended-track rect scales with display_area config; 'uncalibrated — run wizard' badge in GUI; badge persists until wizard success; 2-row layout intact; < 800px badge -> icon tooltip; no cold-start emptiness, no hover-only reveal"

