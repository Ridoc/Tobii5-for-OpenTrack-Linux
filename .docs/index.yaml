  LESSONS_LEARNED: "→ gaze-transform.yaml §GAZE_Y_TRANSFORM_SAGA (Y-axis saga v0.1.1→v0.2.6). 3 transferable rules: (1) NEVER assume device axis origin/direction — confirm raw_y range + glance direction empirically BEFORE writing any transform; (2) a stale calibration.json (negative gaze_y_scale) silently flips Y — after ANY geometry change delete calibration.json + rerun wizard, verify gaze_y_scale positive; (3) single shared transform helper (core.deviceToGui) used by pipeline+GUI+fitAffine so all 3 paths agree — a wrong-direction base transform makes the wizard fitAxis reject the (negative) scale and silently no-op, so 'calibration never sticks' is a SYMPTOM of a wrong base transform, not a calibration bug. (4) v0.2.7 BATCH_2: the corner-hold witness (tobii_filter 3c) assumes OUTPUT-sign == GAZE-sign; synthetic tests must pin the gaze on the SAME side as the output (flip=false + pivotTurn(+deg) => gaze 0.3; flip=true => gaze 0.7), else the witness caps the n=1 drift and the test silently measures the wrong thing. (5) v0.2.7 BATCH_2 v3 (2026-08-30): never tune raw-space drift bounds with head_gain=1.0 + linear curve — the real rig edge amplification (gain x Tobii-spline slope, ~8x near 20-35 input) silently blows RAW targets into 124-145 deg OUTPUT while tests pass; caps must be expressed in OUTPUT space via invertCurve()/head_gain. Cap the drift TARGET, never the live value (live clamp = instant snap, breaks long-holds like BATCH_1e's lg=-25->160). Synthetic corner tests must use REALISTIC gaze strength (0.7, not 0.85): an unrealistically strong pinned gaze inflates the eye_ratio tug and 'fails' the cap test via a mechanism the real rig never hits."
