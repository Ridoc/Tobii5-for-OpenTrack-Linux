  LESSONS_LEARNED: "→ gaze-transform.yaml §GAZE_Y_TRANSFORM_SAGA (Y-axis saga v0.1.1→v0.2.6). 3 transferable rules: (1) NEVER assume device axis origin/direction — confirm raw_y range + glance direction empirically BEFORE writing any transform; (2) a stale calibration.json (negative gaze_y_scale) silently flips Y — after ANY geometry change delete calibration.json + rerun wizard, verify gaze_y_scale positive; (3) single shared transform helper (core.deviceToGui) used by pipeline+GUI+fitAffine so all 3 paths agree — a wrong-direction base transform makes the wizard fitAxis reject the (negative) scale and silently no-op, so 'calibration never sticks' is a SYMPTOM of a wrong base transform, not a calibration bug."