# lessons.yaml — append-only lessons ledger (hard-won, attributed, date-stamped)
# Indexed-docs discipline: terse; root_cause + prevention only. History in git log.
# See .docs/index.yaml CONCEPT_ROUTES -> LESSONS
UPDATED: "2026-09-21"

LESSONS:
  - id: "2026-09-16-plan-spec-write-quirk"
    domain: "tooling"
    root_cause: "opencode write/edit tool permission matcher glob `**/plan-spec-*.yaml` does NOT match an absolute path on this NFS mount (/mnt/NAS-Zeno/...) — rejected the path despite the allow rule (likely `**` glob quirk with absolute NFS paths)."
    prevention: "When the write/edit tool rejects a plan-spec-*.yaml absolute path despite the allow rule, create the file via bash heredoc instead. If config looks stale, verify on a fresh opencode process (config loads once at startup)."
    session: "v0-3-planning-research"
    verified: "2026-09-16"

  - id: "2026-09-16-tropaion-cleanroom-sibling"
    domain: "research"
    root_cause: "Before adopting external techniques, need to validate them against a clean-room sibling in the SAME ET5 protocol family rather than guessing."
    prevention: "Cross-check any external project against our own upstream fork (tobiifree) to confirm protocol-family alignment. Tropaion/Tobii_Linux (Rust, GPL-3.0) is the closest sibling — same TTP/TLV family — so its accuracy-diagnostic, cal-reapply-on-connect, and tolerance-region viz are safe to adopt. njmill (early POC) and Talon (docs) are reference only."
    session: "v0-3-planning-research"
    verified: "2026-09-16"

  - id: "2026-09-16-ultrawide-reach-gap"
    domain: "calibration/UX"
    root_cause: "Stimulus points placed at screen extremes may exceed the ET5 tracker's physical ±28 deg usable gaze range (UL-reach gap), so corner calibration points are unreachable even when the wizard places them."
    prevention: "Keep calibration stimulus points within the usable tracked range; validate the corner gate against the tracker's physical reach, not only screen geometry. (Talon wiki 'screen too big for tracker -> corner dots unreachable' confirms this.)"
    session: "v0-3-planning-research"
    verified: "2026-09-16"

  - id: "2026-09-16-jitter-attribution-before-fix"
    domain: "diagnostics/jitter"
    root_cause: "Center-space jitter could be device raw noise OR a poor calibration fit; changing smoothing/alpha without measurement is guesswork and risks masking the real source."
    prevention: "Before touching smoothing/alpha (BATCH_2), run a DATA-DERIVED baseline first (BATCH_1 --diag-jitter + 39-target --accuracy sweep) to attribute center jitter to one source (raw device noise | One-Euro residual | tug-path | calibration fit). Only then fix the dominant source — no hardcoded 0.12 thresholds."
    session: "v0-3-planning-research"
    verified: "2026-09-16"

  - id: "2026-09-19-true-edge-calibration-constrains-fit"
    domain: "calibration"
    root_cause: "5-point calibration at near-corners (0.15/0.85) does not sample the device's non-linear response at screen extremes; affine fit extrapolates beyond its data, producing corner residual errors that a 9-point wizard with true-edge points (0.02/0.98) constrains at the actual gaze range boundary."
    prevention: "When fitting gaze-to-display, include TRUE-EDGE stimulus points (0.02 and 0.98, not 0.15/0.85) so the fit is constrained at the physical gaze range boundary — this prevents extrapolation-induced corner error even keeping an affine pipeline formula."
    session: "cal-fit-v0.3.1"
    verified: "2026-09-19"

  - id: "2026-09-19-single-eye-per-point-offset-tracking"
    domain: "calibration/diagnostics"
    root_cause: "At true-edge corners the ET5 clip mount occludes one eye (nose-side), so the fit averages over single-eye frames with a ~½ IPD lateral offset — without per-eye tracking the fit cannot account for this systematic bias at single-eye points."
    prevention: "Track which eye(s) are valid per calibration point (left_eye_frames / right_eye_frames counters); log per-point eye_ratio; if residual maps show consistent lateral bias at single-eye corners, subtract a monocular offset (½ IPD) for those points during the fit."
    session: "cal-fit-v0.3.1"
    verified: "2026-09-19"

  - id: "2026-09-21-hold-only-prevents-tap-race"
    domain: "calibration"
    root_cause: "TAP (press-to-start-fixed-duration) mode in the calibration wizard had a race condition: the GTK key-press handler called beginCapture() directly, racing the stream thread's sample accumulation — a fast tap could start-capture and immediately auto-advance before the stream thread saw pending_start, losing samples."
    prevention: "HOLD-only mode: SPACE press sets a pending_start flag (consumed by the stream thread via shared state, not direct beginCapture in the GTK handler); SPACE release sets hold_released flag (calKeyReleased handler); the stream thread checks both flags to start/finalize capture. Each point requires a deliberate press-and-hold — no auto-advance. TAP behavior removed entirely."
    session: "cal-fit-v0.3.2-rc1"
    verified: "2026-09-21"

  - id: "2026-09-21-cairo-cimport-in-submodule"
    domain: "build/cairo"
    root_cause: "On Zig 0.15 ReleaseSafe, @cImport(\"cairo...\") in a non-root (sub-module) .zig file (accuracy_diag.zig) fails to link — Zig does not propagate the C header search/Linkage context to imported modules the same way as the root executable module, producing link errors or undefined C symbols in ReleaseSmall/ReleaseSafe."
    prevention: "Always place @cImport for system libraries (cairo, gtk) in the ROOT module (main.zig) and pass the C types/functions down to submodules via module-level const aliases or parameter passing. accuracy_diag.zig is now pure data (constants + types, no @cImport). If a submodule needs a C type, define a Zig-side alias and let the root module own the import."
    session: "cal-fit-v0.3.2-rc1"
    verified: "2026-09-21"

  - id: "2026-09-21-bezel-obscures-edge-corners"
    domain: "calibration/UX"
    root_cause: "True-edge calibration stimulus points placed at normalized 0.02/0.98 (2% / 98% of screen width/height) land physically under or behind the monitor's plastic bezel on ultrawide displays, so the user cannot see the dot — the point is unreachable and calibration fails at that corner."
    prevention: "True-edge corners inset to 0.04/0.96 (4% / 96%): far enough from the absolute edge to clear the bezel lip on the Ridoc ET5 clip-mount geometry (800x330mm display, origin (-400,-10), tilt 12 deg), while still at the physical gaze-range boundary that constrains the affine fit. This keeps the corner within the ET5's usable gaze range while being visible above the bezel."
    session: "cal-fit-v0.3.2-rc1"
    verified: "2026-09-21"
