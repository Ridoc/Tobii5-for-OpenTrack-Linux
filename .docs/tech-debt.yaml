  - id: "cal-center-offset"
    severity: "high"
    status: "resolved-v0.2.1"
    detail: "Phase 1.3 controlled capture (2026-08-22, 11 dumps): center gaze y=0.24-0.31 (expected 0.5); bottom-edge y=0.80 (expected 0.95); BR y=0.79; BL x=0.50 (expected 0.05, eye origin left). Y offset ~-0.20-0.25 + vertical compression; X fold-over at BL. Single-eye garbage frames confirmed at screen corners (validity collapse to ~40-50% at TL/TR/top-edge). ROOT CAUSE (Phase 2A analysis): display-plane geometry mismatch hypothesis FALSIFIED -- no eye position + plane (z0, tilt) explains the device readings (concurrency fit residual 44-85mm; only y-consistent solutions put eye at z~90mm; free-tilt solutions absurd, tilt 32-39deg / eye z 330-350mm, fail BR-x by 366-587mm). The device gaze estimation itself is biased: grows with gaze elevation (center 86mm low, bottom ~45mm low, top 31% unreadable). FIX: bridge-side affine correction y=(raw+0.394)/1.278 (Preset gaze_y_offset=0.394, gaze_y_scale=1.278; zeroes center 0.245->0.5 and bottom; no x correction). Plane retained at clip-mount default (z=65, tilt=12). VERIFIED: center/bottom re-verify captures PENDING user at screen."
