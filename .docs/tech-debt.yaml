  - id: "cal-point-inset"
    severity: "medium"
    status: "resolved-v0.2.4"
    detail: "Top calibration corners at 5% from edges (0.05,0.05) caused 0/180 valid frames even with 3s capture window. Root cause: capture gate used eye-origin validity (0x07/0x0d) which flips to 4 at extreme angles. FIX (v0.2.4): bridge-side plausibility gate — accept per-eye sample if validity==0 OR per-eye 2D coords plausible (not −1.0 sentinel, not (0,0) zero-vector, finite). No protocol/driver change needed. Corner capture now robust; inset points (0.15,0.15) kept as safety margin for device gaze-y bias (top 31% unreadable)."
