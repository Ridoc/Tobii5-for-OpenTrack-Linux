  - id: "viz-eye-validity-false-positive"
    severity: "medium"
    status: "resolved-v0.2.4"
    detail: "Eye visualization bugs at upper screen edge (2026-08-23, INVESTIGATION COMPLETE). Two distinct causes: (1) 'only 1 eye shown' — device per-eye 2D y legitimately exceeds 1.0 at upper edge (raw up to ~2.0, corrected ~1.9); old gate [−0.5,1.5] rejected real tracking. FIX: accept any finite non-sentinel coords. (2) 'eye jumps to left edge' — when an eye is lost (validity=4) device sends 2D=(0,0) which affine-correction mapped to (0,0.308)=left edge; old gate accepted (0,0). FIX: reject (0,0) and keep last known position (dot turns red, stays put). Track-box investigation (daemon 0x1d/0x1e/0x1f debug capture) CONFIRMS the one-eye loss at edges is a genuine ET5 FOV/track-box limitation: lost eye reports per-output 2D validity=0 (0x1e for R, 0x1d for L) AND 2D=(0,0) — NO valid data exists to recover. Display area verified correct (EDID 800x330mm matches config; device tracks both eyes at y=1.39 some frames)."
