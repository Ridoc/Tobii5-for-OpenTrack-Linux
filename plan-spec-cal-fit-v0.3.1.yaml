NOTES:
  BUILD_QUIRK: "NFS atomic rename fails -> zig build --cache-dir /tmp/zig-local-cache-* + manual binary copy; ReleaseSafe for deploy. nix develop wraps zig."
  FIT_APPROACH: "recommend keeping affine (scale+offset) pipeline formula, upgrade to 9-point data + per-eye offset; OR upgrade pipeline to quadratic. Decide at BATCH_2 implementation based on residual data."
  SINGLE_EYE: "user confirmed hardware tracks one eye fine at corners; IR visible in peripheral sight. Nose-occluded corner → single eye → lateral offset ~½ IPD. Fit must account for this."
  UX_PACING: "both TAP and HOLD SPACE work simultaneously on the same key handler. No mode toggle needed."
