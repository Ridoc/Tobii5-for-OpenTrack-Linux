# plan-spec-cal-fit-v0.3.1.yaml — Calibration fit correction + UX
PLAN_NAME: "cal-fit-v0.3.1"
TITLE: "Quadratic calibration fit (9-point wizard + true-edge points + corner hold) + accuracy UX + manual pacing"
VERSION: "0.1"
DATE: "2026-09-19"
BASE_COMMIT: "current (post v0.3 BATCH_2/3/4 head)"
STATUS: "AWAITING_GO"

PRIORITY: "CAL_FIT > ACC_DIAG_FIX > UX_IMPROVEMENT"

DESIGN_SPEC:
  calibration: "9-point wizard: 5 existing points (Center 0.5,0.5; TL 0.15,0.15; TR 0.85,0.15; BL 0.05,0.95; BR 0.95,0.95) + 4 new TRUE CORNER points (0.02,0.02; 0.98,0.02; 0.02,0.98; 0.98,0.98). Serpentine ordering to minimize gaze jumps. Per-point hold: center 3s (180f), near-corners 5s (300f), true-corners 10s (600f). Brake frames ~330ms (30f) between points for gaze settle. Eye-loss rate >30% → retry visible (existing gate extended to all 9). Unified progress ring + 'Point N/9' from accuracy tool."
  fit: "Quadratic least-squares per-axis: pre ≈ a·gui² + b·gui + c (3 params/axis). N=9 points well-posed. Replaces current affine linear (scale+offset). Records which eye valid per point; if post-BATCH-1 residual map shows consistent lateral bias at single-eye corners, subtract monocular offset."
  accuracy_diag: "Extracted to standalone module accuracy_diag.zig with reusable drawAccuracyResults(). Still --accuracy flag; error computation fixed to apply deviceToGui + current fit before residual vs target (units bug fix). Save for future regression use."
  ux: "Dot radius ~5px (wizard + accuracy). Manual pacing: TAP SPACE = fixed-duration capture; HOLD SPACE = capture-while-held (min-frame guard). Both wizard + accuracy (removes auto-advance)."

ACCEPTANCE_CRITERIA:
  ACCURACY_DIAGNOSTIC_FIXED:
    - "error computed as |corrected_gaze − target| × screen_mm, not |raw_device − target|"
    - "--accuracy still works identically to pre-extraction (modulo correct units)"
    - "edge residual read ~55mm (not 240mm) on current fit"
  CALIBRATION_FIT:
    - "look at screen center → corrected gaze reads (0.5±0.01, 0.5±0.01)"
    - "look at left edge (0.15, 0.15) → corrected gaze reads (0.15±0.02, 0.15±0.02)"
    - "look at true top-left corner (0.02, 0.02) → corrected gaze reads (0.02±0.03, 0.02±0.03)"
    - "quadratic fit returns scale ∈ [0.5, 3.0] and symmetric left/right (scale_x_L ≈ scale_x_R)"
    - "identity on synthetic perfect data (post-deviceToGui): scale=1, offset=0"
    - "synthetic S-curve: edge residual improved vs linear fit (any N≥5)"
  WIZARD_UX:
    - "9 points complete without crash; serpentine order visible (no screen-spanning jumps >90% width consecutively)"
    - "holds: center ~3s, near-corners ~5s, true-corners ~10s consistent"
    - "brake frames between points: visible settle pause (~0.3s) before capture starts"
    - "dot radius ~5px clearly smaller than ~12px old"
    - "TAP SPACE starts fixed capture; HOLD SPACE captures while held (both work)"
    - "eye_loss_rate > 30% on any point: RETRY with visible warning"
    - "unified progress UI shows 'Point N/9' + progress ring + progress bar"
    - "instruction text updated: 'look at the very corner of your monitor' for corner points"
  ACCURACY_UX:
    - "dot radius ~5px"
    - "TAP/HOLD SPACE pacing (removed auto-advance)"
    - "R/r key restarts wizard from accuracy results (existing)"

