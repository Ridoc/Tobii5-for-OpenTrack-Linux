# plan-spec.yaml — v0.2.7 Corner Tracking: Stability + Range + Jaw Artifacts
# Goal: stable corner gaze (no wobble), full edge reach in-game, jaw artifacts
#       filtered with data-derived thresholds, display area verified.
# BASE_COMMIT: f837c53 (v0.2.6 fix — user manual test CONFIRMED)
# REWRITTEN 2026-08-29 after critical review of prior v0.2.7 draft + user feedback.
#   DROPPED premises (code-verified wrong):
#     - "Option B not implemented" -> user CONFIRMS eye tracks outside viz box
#       (factor 2.5 IS active; GUI dot outside box is by-design, deviceToGui
#       maps the EXPANDED track box onto the physical rect)
#     - "corner coverage = hardware FOV limit" -> user reports both eyes often
#       tracked at corners; the instability is PIPELINE state, not device FOV
#   ROOT CAUSE "in-game inner 60%": n=1 yaw FREEZE + corner-drift authority
#     only 0.36 (tobii_filter.zig:1003) + edge eye-ratio dropped to 0.15
#     (:1179-1184) -> view stalls ~60-70% of a full edge turn. NOT track box.
#   ROOT CAUSE "wobbly/jumpy at corners": n=1/n=2 oscillation. Pipeline gates
#     rotation on 3D ORIGIN validity only (:672-673); calibration.feedSample
#     already accepts per-eye 2D plausibility as validity (calibration.zig:115-119)
#     while the pipeline does NOT -> both eyes visible in GUI (per-eye 2D dots,
#     main.zig:510-527) but pipeline flaps to n=1 when origins flicker.
#   JAW FILTER (was): |L_y - R_y| > 0.12 CANNOT work in n=1 — the lost eye
#     reports (0,0) sentinel -> false trigger; and it never fires in the state
#     where jaw artifacts appear. Diagnostics FIRST (BATCH_3), threshold
#     data-derived (BATCH_4). User: "not sure which state -> log it first".
#   ORDER: stability (B1) -> range (B2) -> diagnostics (B3) -> jaw filter (B4).
#     User chose "Both, stability first".

