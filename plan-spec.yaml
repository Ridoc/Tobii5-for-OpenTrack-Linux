  BATCH_2.5:
    TITLE: "invertCurve cap-cancellation fix + x4-preset regression (plan-agent retrospective 2026-08-30)"
    STATUS: DONE # code + QA green 2026-08-30 (bridge 16/16 incl 3 new invertCurve tests + BATCH_2g-x4; driver 23/23)
    DONE_NOTE: "2026-08-30: invertCurve .tobii branch now scales the output target by the cap (out*180/cap yaw, *90/cap pitch) BEFORE walking the pts table, and uses BISECTION instead of a linear lerp (Catmull-Rom is a cubic — the lerp was off by ~2.3 deg near the {20,100}->{35,160} knot at cap=120, caught by the round-trip test). invertCurve made pub (applyCurve already pub). Zig 0.15 gotcha discovered: imported-file tests (in tobii_filter.zig) are NOT auto-run — only test-root file tests execute; moved the 3 invertCurve tests into bridge_tests.zig where they actually run. Behavior-neutral on tobii-official (max_yaw=180, scale 1.0). Verified x4 path: invertCurve(95, cap=120) -> raw 30.6 -> output exactly 95 (was raw 18.67 -> 63.3 deg under-cap)."
    RATIONALE: "Code review finding: invertCurve() (tobii branch) inverts assuming out=catmull(x), but applyCurve computes out=catmull(x)*cap/180 (yaw) / *cap/90 (pitch). Exact ONLY when cap=180/90 (tobii-official default — user's rig). On x4/x4-smooth (max_yaw=120) the inversion is WRONG: invertCurve(95) returns raw 18.67, real output there is 63.3 deg -> the n=1 drift would UNDER-CAP and the view stops short of the edge. Latent bug; does NOT bite the user rig today (max_yaw=180) — fix before x4 presets are used at corners. Behavior-neutral on tobii-official (scale 180/180=1.0)."
    SUBAGENTS:
      qa-tester: {WHEN: "after code", CMD: "cd applications/tobiifree-opentrack && zig build test"}
    STEPS:
      - {DONE: "fix invertCurve (tobii branch): scale the target by the cap BEFORE walking the pts table — yaw: catmull_target = out*180/cap; pitch: out*90/cap — so returned raw satisfies applyCurve(raw)==out for ANY cap"}
      - {DONE: "new regression test BATCH_2g-x4: BATCH_2g scenario with max_yaw=120 + head_gain=2.0 + flip_yaw -> drift output reaches >= natural edge (~63) and stays <= cap+slack (no under-cap stop-short)"}
      - {DONE: "confirm bridge 12/12 + new test + driver 23/23 still green after the fix — FINAL: bridge 16/16 (13 original + BATCH_2g-x4 + 3 invertCurve round-trip/monotonic/pitch) + driver 23/23 GREEN"}
    GATE_NOTE: "QA-only gate (no user-facing behavior change on tobii-official); safe to run in parallel with the BATCH_2 v3 deploy + user gate"

