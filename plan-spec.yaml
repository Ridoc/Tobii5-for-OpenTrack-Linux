  - "USER: both eyes often tracked at corners but fallback unstable / wobbly / jumpy. Root: pipeline ignores per-eye-2D plausibility -> n=1/n=2 flapping."
  - "USER: jaw movement up/down at corners visible in logs. State (n=1 vs n=2) UNKNOWN -> BATCH_3 logging first."
  - "USER: upper corner tracking not optimal (wobbly/jumpy) — same n-flap root cause, covered by BATCH_1."
  - "FACTOR TRAP: pipeline uses PRESET track_box_factor (tobii_filter.zig:810), GUI uses DAEMON 112B factor (main.zig:493) — they can diverge silently."
  - "FACTOR <-> CALIBRATION COUPLING: deviceToGui(f) feeds fitAffine (calibration.zig:323-340). ANY factor change invalidates existing calibration.json (stale-file class documented in gaze-transform.yaml). Factor change REQUIRES daemon restart + wizard re-run + delete calibration.json."
