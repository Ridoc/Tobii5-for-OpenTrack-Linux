>25 deg over 270 frames, gaze pinned 0.7 (realistic corner look — 0.85 was unrealistically strong and inflated the gaze TUG), asserts max_fy<=105 (drift capped at 95 + ~5 residual = legit eye_ratio tug) AND >=80; BATCH_2g dev iterations: anchor 10 deg FAILED (already maps to ~100 output > cap) -> 5 deg) + driver 23/23. v3 NOT YET DEPLOYED (running GUI bridge PID 13208 = v2 binary); USER GATE PENDING (a) no 90-deg creep while holding corners (b) upper corners now engage (c) general movement fluid."
