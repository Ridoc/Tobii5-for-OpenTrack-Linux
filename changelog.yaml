  v0.1.1:
    date: "2026-08-21"[cite: 9]
    theme: "EDID auto-detect, pre-curve deadzone, adaptive eye ratio"[cite: 9]
    added:
      - "EDID auto-detect: parses /sys/class/drm/card*-*/edid"[cite: 9]
      - "Pre-curve deadzone: applied before response curve"[cite: 9]
